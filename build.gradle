plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = project.mod_id
}

repositories {
	// Farmer's Delight is bundled in ./repo so the build works without network access.
	maven {
		name = "Bundled"
		url = uri("repo/maven")
		content { includeGroup "maven.modrinth" }
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
	maven {
		name = "Greenhouse Maven"
		url = "https://repo.greenhouse.house/releases/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Required at runtime, and needed on the compile classpath (WildCropBlock, FeastBlock, mlconfigs).
	implementation "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"

	// Development runtime only: lets `runServer` / `runClient` verify the mod loads.
	localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	localRuntime "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
}

loom {
	mods {
		"culturaldelights" {
			sourceSet sourceSets.main
		}
	}

	runs {
		server {
			server()
			programArg '--nogui'
			runDir 'run'
		}
		// `runClient` starts the game with the mod loaded; used to eyeball models/names.
		client {
			client()
			runDir 'run'
			programArgs '--quickPlaySingleplayer', 'New World'
		}
	}
}

processResources {
	def props = [
		version            : project.mod_version,
		minecraft_version  : project.minecraft_version,
		loader_version     : project.loader_version
	]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.mod_id}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
